<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Money | Cloudflare Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(140deg,#edf4f7,#f5f6fa 55%,#e5f5f2);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:#202533}.card{width:min(100%,430px);background:white;border:1px solid #e6e9ef;border-radius:26px;padding:28px;box-shadow:0 20px 55px #1d34451a}.logo{width:48px;height:48px;display:grid;place-items:center;background:#dff4f3;color:#168f94;border-radius:16px;font-size:24px;font-weight:900}.eyebrow{color:#168f94;font-size:11px;letter-spacing:2px;font-weight:800;margin-top:20px}.title{font-size:30px;letter-spacing:-.8px;margin:4px 0 8px}.muted{color:#7e8797;font-size:13px}label{display:block;font-size:12px;color:#697386;font-weight:700;margin:18px 0 6px}input{width:100%;padding:12px;border:1px solid #dfe4eb;border-radius:11px;font:inherit}button{width:100%;margin-top:18px;border:0;border-radius:11px;padding:12px;background:#16b7b2;color:white;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.6}.status{padding:11px 12px;border-radius:10px;background:#f4f7fa;color:#566274;font-size:13px;margin-top:14px;overflow-wrap:anywhere}.error{background:#fff0f1;color:#a63242}.safety{font-size:11px;color:#8a93a2;margin-top:18px}
</style></head><body><main class="card"><div class="logo">₭</div><div class="eyebrow">ALL MONEY · CLOUDFLARE</div><h1 class="title">Secure sign in</h1><p class="muted">Sign in to access your dashboard and synchronize your records across devices.</p>
<form id="form"><label for="password">Dashboard password</label><input id="password" type="password" autocomplete="current-password" required minlength="1" placeholder="Enter your dashboard password"><button id="submit" type="submit">Sign in securely</button></form><div id="status" class="status" role="status">Use the password configured in your Cloudflare Pages environment secrets.</div><div class="safety">This is your dashboard password, not your bank or mobile-money password. Keep it private.</div></main>
<script>
const form=document.getElementById('form'),button=document.getElementById('submit'),statusBox=document.getElementById('status');
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;statusBox.className='status';statusBox.textContent='Signing in…';try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Sign-in failed.');statusBox.textContent='Signed in. Opening dashboard…';location.replace('index.html')}catch(err){statusBox.className='status error';statusBox.textContent=err.message}finally{button.disabled=false}});
</script></body></html>
