<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Money | Secure Login</title>
<style>
:root{--teal:#16b7b2;--ink:#202533;--muted:#7e8797;--line:#e6e9ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(140deg,#edf4f7,#f5f6fa 55%,#e5f5f2);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}.card{width:min(100%,430px);background:white;border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:0 20px 55px #1d34451a}.logo{width:48px;height:48px;display:grid;place-items:center;background:#dff4f3;color:#168f94;border-radius:16px;font-size:24px;font-weight:900}.eyebrow{color:#168f94;font-size:11px;letter-spacing:2px;font-weight:800;margin-top:20px}.title{font-size:30px;letter-spacing:-.8px;margin:4px 0 8px}.muted{color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;margin:22px 0 16px}.tabs button,.submit{border:1px solid var(--line);border-radius:11px;padding:11px 14px;font:inherit;cursor:pointer}.tabs button{flex:1;background:#f6f8fa;color:var(--muted)}.tabs button.active,.submit{background:var(--teal);border-color:var(--teal);color:white;font-weight:800}label{display:block;font-size:12px;color:#697386;font-weight:700;margin:13px 0 6px}input{width:100%;padding:12px;border:1px solid #dfe4eb;border-radius:11px;font:inherit}input:focus{outline:2px solid #b7e9e6;border-color:var(--teal)}.submit{width:100%;margin-top:18px}.status{padding:11px 12px;border-radius:10px;background:#f4f7fa;color:#566274;font-size:13px;margin-top:14px;overflow-wrap:anywhere}.status.error{background:#fff0f1;color:#a63242}.status.ok{background:#e8f8f3;color:#14765e}.hidden{display:none}.safety{font-size:11px;color:#8a93a2;margin-top:18px}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0"></script><script src="supabase-config.js"></script></head>
<body><main class="card"><div class="logo">₭</div><div class="eyebrow">ALL MONEY · PERSONAL FINANCE</div><h1 class="title">Welcome back</h1><div class="muted">Sign in to securely access your dashboard and sync your records across browsers and devices.</div>
<div class="tabs"><button id="signInTab" class="active" type="button">Sign in</button><button id="signUpTab" type="button">Create account</button></div>
<form id="authForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="At least 8 characters"><div id="confirmWrap" class="hidden"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Repeat password"></div><button id="submitBtn" class="submit" type="submit">Sign in securely</button></form><div id="status" class="status" role="status">Checking cloud configuration…</div><div class="safety">Your records are private to your account. Use a strong password and never share it. Do not enter your bank password here.</div></main>
<script>
(()=>{const $=id=>document.getElementById(id);let mode='signin',client=null;const cfg=window.ALLMONEY_SUPABASE_CONFIG||{};const configured=cfg.url&&cfg.anonKey&&!cfg.url.includes('YOUR_PROJECT')&&!cfg.anonKey.includes('YOUR_SUPABASE');function status(msg,type=''){const e=$('status');e.textContent=msg;e.className='status '+type}function setMode(m){mode=m;$('signInTab').classList.toggle('active',m==='signin');$('signUpTab').classList.toggle('active',m==='signup');$('confirmWrap').classList.toggle('hidden',m!=='signup');$('password').autocomplete=m==='signin'?'current-password':'new-password';$('submitBtn').textContent=m==='signin'?'Sign in securely':'Create account';status(m==='signin'?'Enter your account details.':'Create an account to protect and sync your dashboard.')} $('signInTab').onclick=()=>setMode('signin');$('signUpTab').onclick=()=>setMode('signup');
if(!configured||!window.supabase){$('submitBtn').disabled=true;status('Setup required: configure your Supabase project URL and publishable key in supabase-config.js, then run the supplied SQL setup script.','error');return}client=window.supabase.createClient(cfg.url,cfg.anonKey);client.auth.getSession().then(({data})=>{if(data.session)location.replace('index.html')});
$('authForm').addEventListener('submit',async e=>{e.preventDefault();const email=$('email').value.trim(),password=$('password').value;$('submitBtn').disabled=true;status('Connecting securely…');try{let result;if(mode==='signup'){if(password!==$('confirmPassword').value)throw Error('Passwords do not match.');result=await client.auth.signUp({email,password});if(result.error)throw result.error;if(!result.data.session){status('Account created. Check your email to confirm it, then sign in.','ok');return}}else{result=await client.auth.signInWithPassword({email,password});if(result.error)throw result.error}status('Signed in. Opening your dashboard…','ok');location.replace('index.html')}catch(err){status(err.message||'Unable to sign in. Please try again.','error')}finally{$('submitBtn').disabled=false}});
})();
</script></body></html>
