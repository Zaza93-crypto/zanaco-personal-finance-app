<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>All Money | Account</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(140deg,#edf4f7,#f5f6fa 55%,#e5f5f2);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:#202533}.card{width:min(100%,440px);background:white;border:1px solid #e6e9ef;border-radius:26px;padding:28px;box-shadow:0 20px 55px #1d34451a}.logo{width:48px;height:48px;display:grid;place-items:center;background:#dff4f3;color:#168f94;border-radius:16px;font-size:24px;font-weight:900}.eyebrow{color:#168f94;font-size:11px;letter-spacing:2px;font-weight:800;margin-top:20px}.title{font-size:30px;letter-spacing:-.8px;margin:4px 0 8px}.muted{color:#7e8797;font-size:13px}label{display:block;font-size:12px;color:#697386;font-weight:700;margin:16px 0 6px}input{width:100%;padding:12px;border:1px solid #dfe4eb;border-radius:11px;font:inherit}button{border:0;border-radius:11px;padding:12px;font:inherit;font-weight:800;cursor:pointer}.submit{width:100%;margin-top:20px;background:#16b7b2;color:white}.switch{width:100%;margin-top:10px;background:#edf7f6;color:#147c79}.status{padding:11px 12px;border-radius:10px;background:#f4f7fa;color:#566274;font-size:13px;margin-top:14px;overflow-wrap:anywhere}.error{background:#fff0f1;color:#a63242}.safety{font-size:11px;color:#8a93a2;margin-top:18px}.hidden{display:none!important}
</style></head><body><main class="card"><div class="logo">₭</div><div class="eyebrow">ALL MONEY · PRIVATE FINANCE</div><h1 class="title" id="heading">Sign in</h1><p class="muted" id="intro">Access your financial dashboard and synchronize your records across devices.</p>
<form id="form"><div id="nameWrap" class="hidden"><label for="name">Full name</label><input id="name" autocomplete="name" minlength="2" maxlength="80"></div><label for="email">Email address</label><input id="email" type="email" autocomplete="username" maxlength="254" required placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="10" maxlength="128" required placeholder="At least 10 characters"><button class="submit" id="submit" type="submit">Sign in</button></form>
<button class="switch" id="toggle" type="button">Create a new account</button><div id="status" class="status" role="status">Your account lets you access your own dashboard on multiple devices.</div><div class="safety">Use a unique password. Never enter bank or mobile-money PINs here.</div></main>
<script>
const form=document.getElementById('form'),button=document.getElementById('submit'),toggle=document.getElementById('toggle'),statusBox=document.getElementById('status'),nameWrap=document.getElementById('nameWrap'),nameInput=document.getElementById('name'),password=document.getElementById('password');
let mode='login';
function setMode(next){mode=next;const creating=mode==='register';document.getElementById('heading').textContent=creating?'Create your account':'Sign in';document.getElementById('intro').textContent=creating?'Create a private account to keep your dashboard synchronized across your devices.':'Sign in to access your dashboard and synchronize your records across devices.';nameWrap.classList.toggle('hidden',!creating);nameInput.required=creating;password.autocomplete=creating?'new-password':'current-password';password.minLength=creating?10:1;button.textContent=creating?'Create account':'Sign in';toggle.textContent=creating?'Already have an account? Sign in':'Create a new account';statusBox.className='status';statusBox.textContent=creating?'Your password must be at least 10 characters.':'Use the email and password for your account.';}
toggle.addEventListener('click',()=>setMode(mode==='login'?'register':'login'));
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;toggle.disabled=true;statusBox.className='status';statusBox.textContent=mode==='register'?'Creating account…':'Signing in…';try{const endpoint=mode==='register'?'/api/register':'/api/login';const payload={email:document.getElementById('email').value.trim(),password:password.value};if(mode==='register')payload.name=nameInput.value.trim();const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',cache:'no-store',body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed.');statusBox.textContent='Success. Opening your dashboard…';location.replace('index.html')}catch(err){statusBox.className='status error';statusBox.textContent=err.message}finally{button.disabled=false;toggle.disabled=false}});
</script></body></html>
